<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hamdi Elk hateeb Academy</title>
<meta name="theme-color" content="#06182b">
<style>
:root{
  --bg:#041326; --panel:#071c31; --panel2:#0a233b; --line:#29445e;
  --text:#f4f8fc; --muted:#9eb0c3; --blue:#0d8eea; --blue2:#28b7ff;
  --purple:#a46cff; --shadow:0 18px 45px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:radial-gradient(circle at 50% -20%,#12375a 0,#06182b 35%,#03101e 100%);
 color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
 min-height:100vh;
}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.shell{max-width:1180px;margin:0 auto;padding:22px 18px 70px}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.menu-btn{width:64px;height:64px;border:0;border-radius:18px;background:#0b8fe8;color:white;font-size:30px;box-shadow:var(--shadow)}
.search{height:62px;flex:1;border:1px solid #40566d;border-radius:20px;background:#071c31;color:#fff;display:flex;align-items:center;padding:0 20px;gap:14px}
.search input{flex:1;border:0;outline:0;background:transparent;color:white;font-size:18px}
.search input::placeholder{color:#8498ad}
.profile{background:linear-gradient(180deg,#071c31,#06182b);border:1px solid #29445e;border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.cover{position:relative;height:390px;background:#071b2d;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover:after{content:"";position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(transparent,rgba(4,19,38,.78));pointer-events:none}
.profile-main{padding:0 48px 30px;position:relative}
.avatar{width:210px;height:210px;border-radius:50%;border:9px solid #0d9bea;background:#e9edf2;position:absolute;top:-105px;left:48px;overflow:hidden;box-shadow:0 0 0 4px #06182b,0 12px 35px rgba(0,0,0,.45)}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center top}
.check{position:absolute;right:2px;bottom:5px;width:58px;height:58px;border-radius:50%;background:#16a9ef;border:6px solid #071c31;display:grid;place-items:center;font-size:27px;font-weight:800}
.identity{padding-top:124px}
.identity h1{font-size:42px;line-height:1.08;margin:0 0 10px;letter-spacing:-1.2px}
.verified{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#0d9bea;font-size:18px;vertical-align:middle;margin-left:6px}
.subtitle{font-size:21px;color:#b8c7d6;margin:0 0 14px}
.bio{font-size:18px;color:#778da2;line-height:1.5;margin:0 0 24px}
.actions{display:flex;gap:14px;align-items:center}
.primary,.ghost{border-radius:16px;padding:15px 28px;border:1px solid #276181;font-weight:700}
.primary{background:#0d8eea;color:white;border-color:#0d8eea}
.ghost{background:#071c31;color:#fff;min-width:56px}
.tabs{display:flex;border-top:1px solid #29445e;margin-top:28px}
.tab{flex:1;padding:22px 12px;text-align:center;color:#91a6ba;border-bottom:4px solid transparent;font-size:18px;background:transparent;border-top:0;border-left:0;border-right:0}
.tab.active{color:#fff;border-bottom-color:#0b9bea}
.section{padding:36px 6px 0}
.section h2{font-size:30px;margin:0 0 8px}
.section p.lead{color:#8fa5ba;margin:0 0 22px;font-size:17px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:linear-gradient(180deg,#0a243c,#071a2e);border:1px solid #28445c;border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.card-img{width:100%;height:205px;object-fit:cover;background:#eef1f3;display:block}
.card-body{padding:17px}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#122d49;color:#69caff;font-size:12px;font-weight:800;letter-spacing:.5px}
.card h3{font-size:20px;margin:12px 0 7px}
.card p{margin:0;color:#91a7ba;line-height:1.45}
.card .go{margin-top:15px;width:100%;padding:11px;border-radius:12px;border:1px solid #31516c;background:#0b2239;color:#fff}
.panel{display:none}
.panel.active{display:block}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none}
.drawer.open{display:block}
.drawer-box{width:min(340px,86vw);height:100%;background:#06182b;border-right:1px solid #29445e;padding:24px;box-shadow:20px 0 50px rgba(0,0,0,.35)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.drawer h3{margin:0;font-size:22px}
.nav-item{width:100%;text-align:left;border:1px solid #28445c;background:#071c31;color:#fff;border-radius:14px;padding:14px;margin:7px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#0c2741;border:1px solid #31516c;color:#fff;padding:13px 18px;border-radius:13px;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:30px;border:1px dashed #31516c;border-radius:18px;color:#91a7ba;text-align:center}
footer{text-align:center;color:#6f879d;padding-top:40px;font-size:14px}
@media(max-width:800px){
 .shell{padding:16px 14px 50px}
 .topbar{gap:10px}
 .menu-btn{width:58px;height:58px;border-radius:16px}
 .search{height:58px;border-radius:18px;padding:0 14px}
 .search input{font-size:15px}
 .cover{height:250px}
 .profile-main{padding:0 22px 22px}
 .avatar{width:154px;height:154px;top:-77px;left:22px;border-width:7px}
 .check{width:45px;height:45px;font-size:20px;border-width:4px;right:0;bottom:0}
 .identity{padding-top:92px}
 .identity h1{font-size:29px}
 .subtitle{font-size:17px}
 .bio{font-size:16px}
 .cards{grid-template-columns:1fr}
 .card-img{height:220px}
 .section{padding-top:28px}
 .tabs .tab{font-size:15px;padding:17px 6px}
}
</style>
</head>
