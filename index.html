<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#061b31">
<title>Hamdi Elkhatteeb Academy</title>
<style>
:root{--bg:#061a2d;--panel:#0a2138;--line:#385875;--blue:#079bea;--text:#f5f8fc;--muted:#9db0c4}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}button{cursor:pointer}
.app{max-width:1000px;margin:auto;padding:22px 22px 90px}
.top{display:flex;gap:26px;align-items:center;padding:0 0 24px;border-bottom:3px solid #29445d}
.menuBtn{width:112px;height:92px;border:0;border-radius:24px;background:#079bea;color:white;display:grid;place-items:center;box-shadow:0 12px 30px #00101f88;flex:none}
.menuBtn span,.menuBtn span:before,.menuBtn span:after{display:block;width:45px;height:5px;background:#fff;border-radius:4px;content:"";position:relative}
.menuBtn span:before{position:absolute;top:-15px}.menuBtn span:after{position:absolute;top:15px}
.search{height:86px;flex:1;border:3px solid var(--line);border-radius:27px;background:#091f35;color:white;display:flex;align-items:center;padding:0 28px;gap:20px}
.searchIcon{font-size:37px;color:#9db3c9}.search input{width:100%;border:0;outline:0;background:transparent;color:white;font-size:27px}.search input::placeholder{color:#91a6bb}
.profile{margin-top:52px;border:3px solid #294e6c;border-radius:48px;overflow:hidden;background:#071e34;box-shadow:0 20px 50px #0003}
.cover{height:355px;background:#071425;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block}
.identity{text-align:center;padding:0 22px 38px;position:relative}
.avatar{width:245px;height:245px;border-radius:50%;object-fit:cover;border:12px solid var(--blue);outline:7px solid #dfe8f2;background:#fff;margin:-125px auto 20px;display:block;position:relative;z-index:2}
.name{font-size:39px;font-weight:800;margin:0 0 16px}.verified{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--blue);font-size:28px;vertical-align:middle;margin-left:8px}
.sub{font-size:25px;color:#b7c6d5;line-height:1.35}.desc{font-size:22px;color:#72869b;line-height:1.45;margin:15px auto 30px;max-width:760px}
.actions{display:flex;justify-content:center;gap:22px}.follow{min-width:305px;padding:18px 28px;border:0;border-radius:20px;background:#078fe0;color:#fff;font-size:25px}.more{width:100px;border:2px solid #385875;border-radius:20px;background:#081f35;color:white;font-size:35px}
.tabs{display:flex;border-top:2px solid #29445d}.tab{flex:1;padding:25px 10px;text-align:center;background:none;border:0;color:#8296aa;font-size:25px;border-bottom:5px solid transparent}.tab.active{color:#fff;border-bottom-color:var(--blue)}
.content{padding:36px 0}.sectionTitle{font-size:30px;margin:0 0 18px;padding:0 12px}.welcome{padding:26px;border:2px solid #29445d;border-radius:28px;background:#091f35;margin-bottom:30px}.welcome p{font-size:20px;color:#a9bacb;line-height:1.55;margin:8px 0}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#091f35;border:2px solid #29445d;border-radius:25px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px)}.card img{width:100%;height:180px;object-fit:cover;display:block}.cardBody{padding:17px}.card h3{margin:0 0 8px;font-size:21px}.card p{margin:0;color:#91a6bb;line-height:1.4}.open{margin-top:14px;width:100%;padding:12px;border:0;border-radius:13px;background:#078fe0;color:#fff}
.drawer{position:fixed;inset:0;background:#0008;z-index:50;display:none}.drawer.open{display:block}.drawerBox{width:min(340px,85vw);height:100%;background:#071d33;padding:25px;border-right:2px solid #31526e}.drawerBox h2{margin:10px 0 30px}.drawerBox button{display:block;width:100%;padding:16px;margin:10px 0;border:1px solid #31526e;border-radius:14px;background:#0b2742;color:#fff;text-align:left}
.moreMenu{display:none;position:absolute;right:25px;margin-top:-30px;background:#0b2742;border:2px solid #385875;border-radius:16px;padding:8px;z-index:8}.moreMenu.show{display:block}.moreMenu button{display:block;background:none;border:0;color:white;padding:12px 18px;width:170px;text-align:left}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0c2945;border:1px solid #4c7395;color:#fff;padding:13px 20px;border-radius:14px;display:none;z-index:80}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;color:#111;height:70px;display:flex;justify-content:space-around;align-items:center;z-index:40;border-top:1px solid #bbb}.bottom button{border:0;background:none;font-size:27px;color:#222}.bottom button.active{color:#078fe0}
.modal{display:none;position:fixed;inset:0;background:#000a;z-index:70;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalBox{max-width:650px;width:100%;background:#092039;border:2px solid #3a5c78;border-radius:24px;padding:24px}.modalBox h2{margin-top:0}.close{float:right;border:0;background:none;color:white;font-size:30px}
@media(max-width:720px){
 .app{padding:22px 22px 90px}.top{gap:26px}.menuBtn{width:112px;height:92px}.search{height:86px;padding:0 20px}.search input{font-size:25px;min-width:0}
 .cover{height:345px}.avatar{width:245px;height:245px;margin-top:-125px}.name{font-size:35px}.sub{font-size:24px}.desc{font-size:21px}
 .cards{grid-template-columns:1fr}.card img{height:220px}.tabs .tab{font-size:23px}
}
@media(max-width:480px){
 .app{padding:22px 22px 90px}.top{gap:26px}.menuBtn{width:112px;height:92px}.search{height:86px}.search input{font-size:24px}
 .profile{margin-top:52px;border-radius:35px}.cover{height:340px}.avatar{width:245px;height:245px}
 .identity{padding-bottom:30px}.name{font-size:34px}.verified{width:44px;height:44px;font-size:25px}.sub{font-size:23px}.actions{gap:22px}.follow{min-width:305px}
}

.verifyLine{display:inline-flex;align-items:center;gap:7px;margin:-5px 0 16px;padding:7px 13px;border:1px solid #168fd0;border-radius:999px;background:#082b47;color:#42b8ff;font-size:16px;font-weight:700}.verified{background:#079bea!important;color:#fff!important;border:3px solid #fff;box-shadow:0 0 0 3px #079bea,0 4px 14px #0006}
</style>
</head>
